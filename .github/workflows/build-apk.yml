name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform folder
        run: |
          flutter create . --org com.ayah --project-name ayah --platforms android
          rm -f test/widget_test.dart
          python3 tool/ci/patch_android.py

      - name: Get packages
        run: flutter pub get

      # Reported but non-blocking, so you still get an APK to try.
      - name: Analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit tests
        continue-on-error: true
        run: flutter test

      - name: Build release APK
        # flutter create's template signs release builds with the debug key —
        # fine for testing on your phone, replace before publishing.
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: ayah-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
